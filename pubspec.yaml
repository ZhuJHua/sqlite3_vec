name: sqlite3_vec
description: "Vector search for SQLite, backed by sqlite-vec. Adds the vec0 virtual table and vec_*() functions to package:sqlite3, compiled from bundled C by a build hook."
version: 0.1.0
homepage: https://github.com/ZhuJHua/sqlite3_vec
repository: https://github.com/ZhuJHua/sqlite3_vec
issue_tracker: https://github.com/ZhuJHua/sqlite3_vec/issues

environment:
  sdk: ^3.10.0

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

topics:
  - sqlite
  - vector-search
  - embeddings
  - knn
  - rag

dependencies:
  code_assets: '>=1.2.1 <3.0.0'
  hooks: ^2.2.0
  native_toolchain_c: '>=0.19.3 <0.20.0'
  sqlite3: ^3.5.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
